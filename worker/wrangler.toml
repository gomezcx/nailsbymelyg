name = "nailsbymelyg-api"
main = "src/index.js"
compatibility_date = "2025-06-01"

[vars]
SQUARE_ENV = "production"            # "sandbox" para pruebas (ubicación de pruebas: "L12K90NNX8GG7")
SQUARE_LOCATION_ID = "LB3NRH4R7V151" # Nailsbymelyg (Main)
ALLOWED_ORIGINS = "https://nailsbymelyg.com,https://www.nailsbymelyg.com,http://localhost:8765"
SITE_URL = "https://nailsbymelyg.com"
# Opcional: correo de las gift cards con Resend (resend.com). La clave va como secreto:
#   npx wrangler secret put RESEND_API_KEY
MAIL_FROM = ""                       # ej. "Nails by MelyG <giftcards@nailsbymelyg.com>"
NOTIFY_EMAIL = ""                    # correo de Mely (avisos de gift cards y "responder a" de los recordatorios)

# Recordatorios de cita por correo (usan RESEND_API_KEY y MAIL_FROM)
REMINDER_HOURS = "24"                # horas antes de la cita; "24,2" manda también uno 2 h antes
TIMEZONE = "America/Chicago"
WHATSAPP = "18323104747"
ADDRESS = "2727 N Mason Rd, Suite 301, Katy, TX 77449"
MAPS_URL = "https://maps.app.goo.gl/jeEr8PQE1xyBjdHz8"
# Para lanzarlos a mano y probar: npx wrangler secret put ADMIN_KEY

# Confirmación de asistencia: "1" cancela 1 h antes las citas sin confirmar (reservadas con +24 h). "0" lo apaga.
REQUIRE_CONFIRM = "1"
CONFIRM_SINCE = "2026-09-29T17:16:00Z"   # citas reservadas desde aquí
# Aplica la confirmación también a citas reservadas antes, desde esta fecha de cita (vacío = apagado).
# Encenderlo solo cuando el SMS de recordatorio de Square lleve el enlace nailsbymelyg.com/confirmar.
CONFIRM_ALL_FROM = ""

[[kv_namespaces]]
binding = "WAITLIST"
id = "cf02df51af0c495d876e4f7d11ad2395"

[triggers]
crons = ["*/15 * * * *"]             # cada 15 min (recordatorios solo en la hora en punto)

# El token NO va aquí. Se guarda como secreto:
#   npx wrangler secret put SQUARE_ACCESS_TOKEN
